<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevFlow - Flowchart Documentation</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --bg-color: #f5f6fa;
            --text-color: #2c3e50;
            --border-color: #dcdde1;
            
            /* Flowchart Colors */
            --fc-start: #3498db;
            --fc-end: #2ecc71;
            --fc-decision: #f1c40f;
            --fc-database: #9b59b6;
            --fc-io: #a2d9ce;
            --fc-process: #ecf0f1;
            --fc-document: #e67e22;
            --fc-manual: #e84393;
            --fc-display: #00cec9;
            --fc-error: #e74c3c;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Calibri, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 300px;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            background-color: #1a252f;
            text-align: center;
        }

        .sidebar-header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #ecf0f1;
        }

        .sidebar-header p {
            margin: 5px 0 0;
            font-size: 0.85rem;
            color: #bdc3c7;
        }

        .nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-item {
            border-bottom: 1px solid #34495e;
        }

        .nav-button {
            width: 100%;
            background: none;
            border: none;
            color: #bdc3c7;
            text-align: left;
            padding: 15px 20px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            font-family: inherit;
        }

        .nav-button:hover {
            background-color: #34495e;
            color: white;
        }

        .nav-button.active {
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            border-left: 4px solid #ecf0f1;
        }

        .fc-code {
            font-size: 0.75rem;
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 10px;
            font-weight: normal;
        }

        /* Main Content Styles */
        .main-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 40px;
            background-color: var(--bg-color);
        }

        .flowchart-section {
            display: none;
            background: white;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 1200px;
            margin: 0 auto;
        }

        .flowchart-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fc-header {
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .fc-header h2 {
            margin: 0 0 10px 0;
            color: var(--primary-color);
            font-size: 2rem;
            display: flex;
            align-items: center;
        }

        .fc-badge {
            background-color: var(--accent-color);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 1rem;
            margin-right: 15px;
        }

        .fc-meta {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .fc-meta-label {
            font-weight: bold;
            color: var(--secondary-color);
        }

        .mermaid {
            display: flex;
            justify-content: center;
            margin: 40px 0;
            padding: 20px;
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow-x: auto;
        }

        .fc-explanation {
            background: #f8f9fa;
            border-left: 4px solid var(--accent-color);
            padding: 25px;
            border-radius: 0 8px 8px 0;
            margin-top: 40px;
        }

        .fc-explanation h3 {
            margin-top: 0;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-size: 1.3rem;
            border-bottom: 1px solid #dcdde1;
            padding-bottom: 10px;
        }

        .step-list {
            padding-left: 20px;
            margin: 0;
        }

        .step-list li {
            margin-bottom: 12px;
            line-height: 1.6;
            color: #34495e;
        }

        .step-list li strong {
            color: var(--primary-color);
        }

        /* Legend */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
            padding: 15px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid rgba(0,0,0,0.1);
        }
    </style>
    <!-- Include Mermaid.js -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
        mermaid.initialize({ 
            startOnLoad: false,
            theme: 'base',
            themeVariables: {
                fontFamily: 'Inter, Segoe UI, Calibri, Arial, sans-serif',
                primaryColor: '#ecf0f1',
                primaryTextColor: '#2c3e50',
                primaryBorderColor: '#bdc3c7',
                lineColor: '#34495e',
                secondaryColor: '#f1c40f',
                tertiaryColor: '#fff'
            },
            flowchart: {
                htmlLabels: true,
                curve: 'linear',
                nodeSpacing: 50,
                rankSpacing: 50
            }
        });
    </script>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>DevFlow</h1>
            <p>Workflow Management System</p>
        </div>
        <ul class="nav-list" id="navList">
            <!-- Navigation will be generated by JS -->
        </ul>
    </aside>

    <main class="main-content" id="mainContent">
        <!-- Flowchart sections will be generated here -->
    </main>

    <script>
        // Common Class Definitions
        const commonClasses = `
            classDef start fill:#3498db,stroke:#2980b9,color:#fff;
            classDef endNode fill:#2ecc71,stroke:#27ae60,color:#fff;
            classDef process fill:#ecf0f1,stroke:#bdc3c7,color:#2c3e50;
            classDef decision fill:#f1c40f,stroke:#f39c12,color:#2c3e50;
            classDef db fill:#9b59b6,stroke:#8e44ad,color:#fff;
            classDef doc fill:#e67e22,stroke:#d35400,color:#fff;
            classDef io fill:#a2d9ce,stroke:#1abc9c,color:#2c3e50;
            classDef manual fill:#e84393,stroke:#fd79a8,color:#fff;
            classDef display fill:#00cec9,stroke:#81ecec,color:#2c3e50;
            classDef conn fill:#ecf0f1,stroke:#34495e,stroke-width:2px;
            classDef error fill:#e74c3c,stroke:#c0392b,color:#fff;
        `;

        const flowcharts = [
            {
                code: "FC-01",
                title: "Master Workflow SDLC",
                desc: "Menggambarkan alur utama proyek dari awal hingga selesai.",
                purpose: "Memberikan gambaran besar keseluruhan proses dalam aplikasi DevFlow.",
                actors: "Client, Project Manager, Team Leader, Senior Developer, Developer, QA Engineer, DevOps Engineer, Mahasiswa Magang, System",
                explanation: [
                    "<strong>Start:</strong> Proses SDLC dimulai ketika ada gagasan proyek baru.",
                    "<strong>Client Request:</strong> Klien mengajukan permohonan pengembangan perangkat lunak.",
                    "<strong>Input Requirement:</strong> Mengumpulkan daftar kebutuhan dan spesifikasi sistem dari klien.",
                    "<strong>Requirement Analysis:</strong> Tim menganalisis kelayakan dan ruang lingkup dari requirement yang diberikan.",
                    "<strong>Requirement Validation:</strong> Sistem atau tim memvalidasi kelengkapan requirement secara formal.",
                    "<strong>Requirement Complete?:</strong> Jika tidak lengkap, kembali ke pengumpulan requirement. Jika lengkap, lanjut ke tahap persetujuan.",
                    "<strong>Project Approval:</strong> Tahap persetujuan kontrak, biaya, dan scope oleh klien maupun manajemen.",
                    "<strong>Create Project:</strong> Admin atau PM membuat entitas proyek di dalam sistem DevFlow.",
                    "<strong>Connector A:</strong> Melanjutkan ke Bagian 2 untuk pembentukan tim dan perencanaan.",
                    "<strong>Assign Project Manager:</strong> Menunjuk manajer proyek (PM) yang bertanggung jawab penuh terhadap proyek.",
                    "<strong>Sprint Planning:</strong> PM dan tim merencanakan iterasi pengerjaan (Sprint).",
                    "<strong>Assign Team Leader:</strong> PM menunjuk pimpinan teknis (Team Leader).",
                    "<strong>Assign Senior Developer:</strong> Penunjukan developer senior sebagai reviewer dan arsitek kode.",
                    "<strong>Assign Developer:</strong> Mengalokasikan developer untuk pengerjaan kode (coding).",
                    "<strong>Assign QA Engineer:</strong> Menugaskan tim Quality Assurance untuk menjaga kualitas aplikasi.",
                    "<strong>Assign Internship:</strong> Melibatkan mahasiswa magang untuk membantu proyek jika diperlukan.",
                    "<strong>Create Task:</strong> Memecah requirement menjadi satuan tugas (task) yang lebih kecil di Kanban.",
                    "<strong>Connector B:</strong> Melanjutkan ke Bagian 3 untuk tahap eksekusi kode.",
                    "<strong>Development:</strong> Developer mulai menulis dan mengembangkan kode aplikasi.",
                    "<strong>Code Review:</strong> Senior Developer memeriksa kode yang telah di-submit oleh developer.",
                    "<strong>Code Review Approve?:</strong> Jika ada masalah (TIDAK), kode dikembalikan ke tahap development. Jika lolos (YA), lanjut ke build.",
                    "<strong>Build Project:</strong> Sistem mengkompilasi dan mem-build kode menjadi aplikasi terintegrasi.",
                    "<strong>QA Testing:</strong> Tim QA melakukan skenario pengujian fungsional pada aplikasi.",
                    "<strong>QA Passed?:</strong> Jika gagal, bug dikembalikan ke tahap development. Jika lolos, siap dirilis.",
                    "<strong>Deployment:</strong> Aplikasi dirilis ke lingkungan production (live).",
                    "<strong>Monitoring:</strong> Tim DevOps memantau kestabilan aplikasi setelah dirilis ke publik.",
                    "<strong>Client Review:</strong> Klien mencoba aplikasi dan memberikan tanggapan/feedback.",
                    "<strong>Client Approve?:</strong> Jika klien meminta perubahan, aplikasi masuk tahap revisi. Jika setuju, proyek selesai.",
                    "<strong>Project Closed:</strong> Status proyek dikunci dan dinyatakan secara resmi selesai (Closed).",
                    "<strong>Generate Report:</strong> Sistem otomatis membuat laporan akhir pengembangan sistem.",
                    "<strong>End:</strong> Proses Master SDLC untuk proyek tersebut berakhir sepenuhnya."
                ],
                mermaid: `
                    graph TD
                    ${commonClasses}

                    %% Part 1
                    subgraph B1["Part 1 (Start → A)"]
                        direction TB
                        A([Start]):::start --> B[/"Client Request"/]:::io
                        B --> C[/"Input Requirement"/]:::io
                        C --> D[\\"Requirement Analysis"/]:::manual
                        D --> E[Requirement Validation]:::process
                        E --> F{"Requirement Complete?"}:::decision
                        F -- TIDAK --> C
                        F -- YA --> G[\\"Project Approval"/]:::manual
                        G --> H[Create Project]:::process
                        H --> CA1((A)):::conn
                    end

                    %% Part 2
                    subgraph B2["Part 2 (A → B)"]
                        direction TB
                        CA2((A)):::conn --> I[Assign Project Manager]:::process
                        I --> J[Sprint Planning]:::process
                        J --> K[Assign Team Leader]:::process
                        K --> L[Assign Senior Developer]:::process
                        L --> M[Assign Developer]:::process
                        M --> N[Assign QA Engineer]:::process
                        N --> O[Assign Internship]:::process
                        O --> P[Create Task]:::process
                        P --> CB1((B)):::conn
                    end

                    %% Part 3
                    subgraph B3["Part 3 (B → End)"]
                        direction TB
                        CB2((B)):::conn --> Q[Development]:::process
                        Q --> R[\\"Code Review"/]:::manual
                        R --> S{"Code Review Approve?"}:::decision
                        S -- TIDAK --> REV1[Kembali ke Development]:::process
                        S -- YA --> T[Build Project]:::process
                        T --> U[QA Testing]:::process
                        U --> V{"QA Passed?"}:::decision
                        V -- TIDAK --> REV2[Kembali ke Development]:::process
                        V -- YA --> W[Deployment]:::process
                        W --> X{{Monitoring}}:::display
                        X --> Y[\\"Client Review"/]:::manual
                        Y --> Z{"Client Approve?"}:::decision
                        Z -- TIDAK --> REV3[Revisi & Development]:::process
                        Z -- YA --> AA([Project Closed]):::endNode
                        AA --> AB[Generate Report]:::process
                        AB --> AC([End]):::endNode
                    end

                    CA1 ~~~ CA2
                    CB1 ~~~ CB2
                `
            },
            {
                code: "FC-02",
                title: "Login & Authentication",
                desc: "Proses otentikasi user untuk mengakses sistem DevFlow.",
                purpose: "Memastikan hanya user yang terdaftar yang memiliki akses.",
                actors: "Semua User, System",
                explanation: [
                    "<strong>Start:</strong> Pengguna membuka halaman login aplikasi DevFlow.",
                    "<strong>Input Username:</strong> Pengguna memasukkan identitas atau email.",
                    "<strong>Input Password:</strong> Pengguna memasukkan kata sandi (password).",
                    "<strong>Login:</strong> Pengguna menekan tombol untuk masuk ke sistem.",
                    "<strong>Validasi User:</strong> Sistem mencari data pengguna berdasarkan username di database.",
                    "<strong>User Valid?:</strong> Jika pengguna tidak ditemukan, kembali ke halaman awal. Jika ditemukan, lanjut validasi.",
                    "<strong>OTP Verification:</strong> Sistem mengirimkan dan meminta kode OTP untuk lapisan keamanan ganda.",
                    "<strong>OTP Valid?:</strong> Jika salah, pengguna diminta memasukkan ulang. Jika benar, otentikasi berhasil.",
                    "<strong>Load Role:</strong> Sistem memuat hak akses khusus milik pengguna (Admin, PM, Dev, dll).",
                    "<strong>Load Permission:</strong> Sistem mengatur menu dan tombol apa saja yang boleh diakses.",
                    "<strong>Dashboard:</strong> Mengarahkan pengguna ke halaman utama (Dashboard) sesuai jabatannya.",
                    "<strong>Session Login:</strong> Sesi aktif dibuat agar pengguna tidak perlu login berulang kali.",
                    "<strong>Logout:</strong> Pengguna mengakhiri sesi dan keluar dari aplikasi secara aman.",
                    "<strong>End:</strong> Proses otentikasi (login/logout) selesai."
                ],
                mermaid: `
                    graph TD
                    ${commonClasses}

                    %% Part 1
                    subgraph B1["Part 1 (Start → A)"]
                        direction TB
                        A([Start]):::start --> B[/"Input Username"/]:::io
                        B --> C[/"Input Password"/]:::io
                        C --> D[Login]:::process
                        D --> E[Validasi User]:::process
                        E --> CA1((A)):::conn
                    end

                    %% Part 2
                    subgraph B2["Part 2 (A → B)"]
                        direction TB
                        CA2((A)):::conn --> F{"User Valid?"}:::decision
                        F -- TIDAK --> REV1[Kembali ke Login]:::process
                        F -- YA --> G[OTP Verification]:::process
                        G --> H{"OTP Valid?"}:::decision
                        H -- TIDAK --> REV2[Input OTP Ulang]:::process
                        H -- YA --> I[Load Role]:::process
                        I --> J[Load Permission]:::process
                        J --> CB1((B)):::conn
                    end

                    %% Part 3
                    subgraph B3["Part 3 (B → End)"]
                        direction TB
                        CB2((B)):::conn --> K{{Dashboard}}:::display
                        K --> L[Session Login]:::process
                        L --> M([Logout]):::endNode
                        M --> N([End]):::endNode
                    end

                    CA1 ~~~ CA2
                    CB1 ~~~ CB2
                `
            },
            {
                code: "FC-03",
                title: "Dashboard",
                desc: "Tampilan utama sistem setelah user berhasil login.",
                purpose: "Menyajikan ringkasan informasi, statistik, dan progress project.",
                actors: "Semua User",
                explanation: [
                    "<strong>Start:</strong> Pengguna berhasil melewati otentikasi login.",
                    "<strong>Load Dashboard:</strong> Sistem mulai merender halaman utama dashboard.",
                    "<strong>Ambil Data User:</strong> Menarik informasi profil pengguna yang sedang aktif.",
                    "<strong>Ambil Data Project:</strong> Mengambil ringkasan dari proyek-proyek yang ditangani pengguna.",
                    "<strong>Ambil Statistik:</strong> Memuat grafik atau angka metrik performa (Key Performance Indicators).",
                    "<strong>Ambil Sprint:</strong> Mengambil informasi sprint (iterasi) yang sedang aktif berjalan.",
                    "<strong>Ambil Task:</strong> Menarik daftar tugas/tiket yang berstatus belum selesai (To-Do/In Progress).",
                    "<strong>Ambil Deadline:</strong> Memeriksa tugas-tugas yang mendekati batas waktu akhir (SLA).",
                    "<strong>Ambil Progress:</strong> Menghitung persentase pencapaian kerja developer/magang saat ini.",
                    "<strong>Tampilkan Dashboard:</strong> Menyajikan dan melukis semua data tersebut ke layar browser pengguna secara visual.",
                    "<strong>Refresh Data:</strong> Memperbarui data secara berkala atau ketika diminta secara asinkron.",
                    "<strong>End:</strong> Proses penyajian dashboard selesai."
                ],
                mermaid: `
                    graph TD
                    ${commonClasses}

                    %% Part 1
                    subgraph B1["Part 1"]
                        direction TB
                        A([Start]):::start --> B{{Load Dashboard}}:::display
                        B --> C[Ambil Data User]:::process
                        C --> D[Ambil Data Project]:::process
                        D --> E[Ambil Statistik]:::process
                        E --> CA1((A)):::conn
                    end

                    %% Part 2
                    subgraph B2["Part 2"]
                        direction TB
                        CA2((A)):::conn --> F[Ambil Sprint]:::process
                        F --> G[Ambil Task]:::process
                        G --> H[Ambil Deadline]:::process
                        H --> I[Ambil Progress]:::process
                        I --> CB1((B)):::conn
                    end

                    %% Part 3
                    subgraph B3["Part 3"]
                        direction TB
                        CB2((B)):::conn --> J{{Tampilkan Dashboard}}:::display
                        J --> K[Refresh Data]:::process
                        K --> L([End]):::endNode
                    end

                    CA1 ~~~ CA2
                    CB1 ~~~ CB2
                `
            },
            {
                code: "FC-04",
                title: "User Management",
                desc: "Modul untuk mengelola data pengguna sistem.",
                purpose: "Mengatur akun pengguna dan hak akses.",
                actors: "Super Admin, Admin, HRD, System",
                explanation: [
                    "<strong>Start:</strong> Administrator mengakses modul User Management.",
                    "<strong>Tambah User:</strong> Menginput data karyawan, mahasiswa magang, atau klien baru.",
                    "<strong>Edit User:</strong> Mengubah informasi profil pengguna yang sudah ada sebelumnya.",
                    "<strong>Hapus User:</strong> Menghapus entri data pengguna dari sistem.",
                    "<strong>Assign Role:</strong> Menentukan tingkat jabatan pengguna (Super Admin, HRD, QA, Dev, dsb).",
                    "<strong>Assign Permission:</strong> Menambahkan hak akses spesifik untuk memberikan izin akses modul tertentu.",
                    "<strong>Reset Password:</strong> Mengembalikan kata sandi jika pengguna melupakannya.",
                    "<strong>Aktivasi User:</strong> Menghidupkan status akun agar pengguna diizinkan login ke sistem.",
                    "<strong>Nonaktifkan User:</strong> Membekukan akun pengguna yang resign atau telah selesai program magang.",
                    "<strong>Simpan Database:</strong> Sistem memvalidasi dan menyimpan seluruh perubahan ke User Database.",
                    "<strong>End:</strong> Siklus manajemen pengguna selesai dieksekusi."
                ],
                mermaid: `
                    graph TD
                    ${commonClasses}

                    %% Part 1
                    subgraph B1["Part 1"]
                        direction TB
                        A([Start]):::start --> B[Tambah User]:::process
                        B --> C[Edit User]:::process
                        C --> D[Hapus User]:::process
                        D --> CA1((A)):::conn
                    end

                    %% Part 2
                    subgraph B2["Part 2"]
                        direction TB
                        CA2((A)):::conn --> E[Assign Role]:::process
                        E --> F[Assign Permission]:::process
                        F --> G[Reset Password]:::process
                        G --> H[Aktivasi User]:::process
                        H --> CB1((B)):::conn
                    end

                    %% Part 3
                    subgraph B3["Part 3"]
                        direction TB
                        CB2((B)):::conn --> I[Nonaktifkan User]:::process
                        I --> J[(Simpan Database)]:::db
                        J --> K([End]):::endNode
                    end

                    CA1 ~~~ CA2
                    CB1 ~~~ CB2
                `
            },
            {
                code: "FC-05",
                title: "Project Management",
                desc: "Proses pembuatan dan pengelolaan project.",
                purpose: "Mencatat detail project dan penugasan tim.",
                actors: "Admin, Project Manager, System",
                explanation: [
                    "<strong>Start:</strong> Admin atau PM mulai mendaftarkan proyek baru.",
                    "<strong>Create Project:</strong> Membuka entitas proyek baru dalam aplikasi DevFlow.",
                    "<strong>Input Client:</strong> Memasukkan/memilih informasi klien atau perusahaan pemesan perangkat lunak.",
                    "<strong>Input Requirement:</strong> Mengunggah dokumen spesifikasi fitur dan cakupan proyek (Scope of Work).",
                    "<strong>Input Timeline:</strong> Menentukan kapan proyek dimulai dan target bulan penyelesaian.",
                    "<strong>Assign PM:</strong> Manajemen mendelegasikan Project Manager sebagai komando proyek.",
                    "<strong>Assign Team:</strong> PM menunjuk tim yang akan bekerja (TL, Backend, Frontend, QA).",
                    "<strong>Input Budget:</strong> Mencatat rincian RAB (Rencana Anggaran Biaya) proyek tersebut.",
                    "<strong>Simpan Project:</strong> Menyatukan seluruh data awal dan menyimpannya di Project Database.",
                    "<strong>Update Project:</strong> Modifikasi data di tengah berjalannya proyek jika terjadi perubahan spesifikasi (Change Request).",
                    "<strong>Monitoring:</strong> PM terus memantau kesehatan waktu dan anggaran (Budget vs Actual).",
                    "<strong>Close Project:</strong> Menutup proyek yang telah rampung agar tidak ada perubahan data insidentil lagi.",
                    "<strong>End:</strong> Penanganan proyek selesai."
                ],
                mermaid: `
                    graph TD
                    ${commonClasses}

                    %% Part 1
                    subgraph B1["Part 1"]
                        direction TB
                        A([Start]):::start --> B[Create Project]:::process
                        B --> C[/"Input Client"/]:::io
                        C --> D[/"Input Requirement"/]:::io
                        D --> E[/"Input Timeline"/]:::io
                        E --> CA1((A)):::conn
                    end

                    %% Part 2
                    subgraph B2["Part 2"]
                        direction TB
                        CA2((A)):::conn --> F[Assign PM]:::process
                        F --> G[Assign Team]:::process
                        G --> H[/"Input Budget"/]:::io
                        H --> I[(Simpan Project)]:::db
                        I --> CB1((B)):::conn
                    end

                    %% Part 3
                    subgraph B3["Part 3"]
                        direction TB
                        CB2((B)):::conn --> J[Update Project]:::process
                        J --> K{{Monitoring}}:::display
                        K --> L([Close Project]):::endNode
                        L --> M([End]):::endNode
                    end

                    CA1 ~~~ CA2
                    CB1 ~~~ CB2

                    "<strong>Client Review:</strong> Klien mengoperasikan langsung sistem di komputer mereka untuk pertama kali.",
                    "<strong>Feedback:</strong> Klien memberikan tanggapan/surat permohonan atas _bug_ kecil yang tidak tersaring tim Dev.",
                    "<strong>Revisi:</strong> Tim Dev melakukan modifikasi cepat/revisi spesifik sesuai masukan klien.",
                    "<strong>Final Testing:</strong> Menguji hasil rilis ulang tersebut apakah fitur perbaikan berjalan stabil.",
                    "<strong>Approval?:</strong> Titik keputusan krusial di mana klien harus menyatakan YA (Puas) atau TIDAK.",
                    "<strong>Project Closed:</strong> Jika setuju, kunci sistem mencegah siapapun mengubah kode. Masa pengembangan usai.",
                    "<strong>Generate Final Report:</strong> Laporan puncak tentang realisasi SLA dan pendanaan.",
                    "<strong>Berita Acara Serah Terima:</strong> Mencetak dokumen final serah-terima kekayaan intelektual perangkat lunak kepada klien.",
                    "<strong>End:</strong> Proyek ditutup sempurna, beralih ke masa _maintenance_."
                ],
                mermaid: `
                    graph TD
                    ${commonClasses}

                    %% Part 1
                    subgraph B1["Part 1"]
                        direction TB
                        A([Start]):::start --> B[\\"Client Review"/]:::manual
                        B --> C[/"Feedback"/]:::io
                        C --> CA1((A)):::conn
                    end

                    %% Part 2
                    subgraph B2["Part 2"]
                        direction TB
                        CA2((A)):::conn --> D[Revisi]:::process
                        D --> E[Final Testing]:::process
                        E --> F{"Approval?"}:::decision
                        F -- TIDAK --> REV[Kembali ke Revisi]:::process
                        F -- YA --> CB1((B)):::conn
                    end

                    %% Part 3
                    subgraph B3["Part 3"]
                        direction TB
                        CB2((B)):::conn --> G([Project Closed]):::endNode
                        G --> H[Generate Final Report]:::process
                        H --> I[/Berita Acara Serah Terima\\]:::doc
                        I --> J([End]):::endNode
                    end

                    CA1 ~~~ CA2
                    CB1 ~~~ CB2
                `
            }
        ];

        // Initialize UI
        document.addEventListener("DOMContentLoaded", () => {
            const navList = document.getElementById('navList');
            const mainContent = document.getElementById('mainContent');

            // Generate HTML
            flowcharts.forEach((fc, index) => {
                // Nav Button
                const li = document.createElement('li');
                li.className = 'nav-item';
                const btn = document.createElement('button');
                btn.className = `nav-button ${index === 0 ? 'active' : ''}`;
                btn.innerHTML = `<span class="fc-code">${fc.code}</span> ${fc.title}`;
                btn.onclick = () => showFlowchart(index);
                li.appendChild(btn);
                navList.appendChild(li);

                // Main Content Section
                const section = document.createElement('div');
                section.className = `flowchart-section ${index === 0 ? 'active' : ''}`;
                section.id = `section-${index}`;

                let explanationHTML = '';
                if(fc.explanation && fc.explanation.length > 0) {
                    explanationHTML = `
                        <div class="fc-explanation">
                            <h3>Penjelasan Detail Proses:</h3>
                            <ul class="step-list">
                                ${fc.explanation.map(step => `<li>${step}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                }

                section.innerHTML = `
                    <div class="fc-header">
                        <h2><span class="fc-badge">${fc.code}</span> ${fc.title}</h2>
                    </div>
                    
                    <div class="fc-meta">
                        <div class="fc-meta-label">Deskripsi:</div>
                        <div>${fc.desc}</div>
                        
                        <div class="fc-meta-label">Tujuan:</div>
                        <div>${fc.purpose}</div>
                        
                        <div class="fc-meta-label">Aktor:</div>
                        <div>${fc.actors}</div>
                    </div>

                    <div class="legend">
                        <strong>Legenda:</strong>
                        <div class="legend-item"><div class="legend-color" style="background:var(--fc-start)"></div> Terminator (Start/End)</div>
                        <div class="legend-item"><div class="legend-color" style="background:var(--fc-process)"></div> Process (Sistem)</div>
                        <div class="legend-item"><div class="legend-color" style="background:var(--fc-io)"></div> Input/Output</div>
                        <div class="legend-item"><div class="legend-color" style="background:var(--fc-decision)"></div> Decision (Cabang)</div>
                        <div class="legend-item"><div class="legend-color" style="background:var(--fc-database)"></div> Database (Penyimpanan)</div>
                        <div class="legend-item"><div class="legend-color" style="background:var(--fc-document)"></div> Document</div>
                        <div class="legend-item"><div class="legend-color" style="background:var(--fc-manual)"></div> Manual Operation</div>
                        <div class="legend-item"><div class="legend-color" style="background:var(--fc-display)"></div> Display (Tampilan)</div>
                    </div>

                    <div class="mermaid">
                        ${fc.mermaid}
                    </div>

                    ${explanationHTML}
                `;

                mainContent.appendChild(section);
            });

            // Initialize Mermaid for the first active section
            const firstMermaid = document.querySelector('.flowchart-section.active .mermaid');
            if(firstMermaid) {
                firstMermaid.removeAttribute('data-processed');
                mermaid.run({ nodes: [firstMermaid] });
            }
        });

        // Tab Switching Logic
        function showFlowchart(index) {
            // Update Buttons
            document.querySelectorAll('.nav-button').forEach((btn, i) => {
                btn.className = `nav-button ${i === index ? 'active' : ''}`;
            });

            // Update Sections
            document.querySelectorAll('.flowchart-section').forEach((section, i) => {
                section.className = `flowchart-section ${i === index ? 'active' : ''}`;
            });

            // Lazy Render Mermaid for the active section
            const activeSection = document.getElementById(`section-${index}`);
            const mermaidDiv = activeSection.querySelector('.mermaid');
            
            if (mermaidDiv && !mermaidDiv.getAttribute('data-processed')) {
                mermaid.run({ nodes: [mermaidDiv] }).catch(err => {
                    console.error("Mermaid Render Error: ", err);
                });
            }
        }
    </script>
</body>
</html>
